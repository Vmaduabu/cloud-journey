services:
  postgres:
    image: postgres:16
    container_name: scout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scoutpassword
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    volumes:
      - scout_postgres_data:/var/lib/postgresql/data

volumes:
  scout_postgres_data: